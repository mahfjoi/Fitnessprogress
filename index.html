<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fitness" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Fitnessprogress</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Zeigt Fehler direkt an, statt nur eine leere Seite
      (function () {
        function show(msg) {
          var root = document.getElementById('root')
          if (root && root.childElementCount > 0) return
          document.body.innerHTML =
            '<div style="font-family:system-ui;padding:24px;color:#c73a3a">' +
            '<h2>Fehler beim Laden</h2><pre style="white-space:pre-wrap;font-size:13px;color:#333">' +
            String(msg).replace(/</g, '&lt;') + '\n\n' + navigator.userAgent + '</pre></div>'
        }
        window.addEventListener('error', function (e) { show(e.message + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')) })
        window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.stack || e.reason) })
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && root.childElementCount === 0) show('App wurde nach 8 Sekunden nicht gestartet (Script nicht geladen?)\nURL: ' + location.href)
        }, 8000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
